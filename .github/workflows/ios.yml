name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: RaceSnapAI.xcodeproj
  SCHEME: RaceSnapAI

jobs:
  # ---------------------------------------------------------------
  # 1) UNSIGNED BUILDS - no Apple account needed
  # ---------------------------------------------------------------
  build-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent build/sim/Build/Products/Release-iphonesimulator/RaceSnapAI.app RaceSnapAI-simulator.app.zip

      - name: Build unsigned device app and IPA
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/RaceSnapAI.app ipa/Payload/
          (cd ipa && zip -qry ../RaceSnapAI-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: RaceSnapAI-unsigned
          path: |
            RaceSnapAI-unsigned.ipa
            RaceSnapAI-simulator.app.zip

  # ---------------------------------------------------------------
  # 2) OPTIONAL SIGNED BUILD - only runs if repo variable
  #    ENABLE_SIGNING = true and the secrets below exist.
  #    Secrets: IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64,
  #             IOS_PROFILE_NAME, APPLE_TEAM_ID, KEYCHAIN_PASSWORD
  # ---------------------------------------------------------------
  build-signed:
    if: ${{ vars.ENABLE_SIGNING == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi

      - name: Install certificate and provisioning profile
        env:
          CERT: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/racesnap.mobileprovision"

      - name: Archive and export IPA
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/RaceSnapAI.xcarchive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Development"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>ai.racesnap.app</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/RaceSnapAI.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export

      - uses: actions/upload-artifact@v4
        with:
          name: RaceSnapAI-signed
          path: build/export/*.ipa
